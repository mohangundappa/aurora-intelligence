spring:
  application.name: aurora-intelligence
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aurora}
    username: ${DATABASE_USER:aurora}
    password: ${DATABASE_PASSWORD:aurora_dev}
    hikari.initialization-fail-timeout: -1
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    connect-timeout: 500ms
    timeout: 500ms
  kafka:
    bootstrap-servers: ${REDPANDA_BROKERS:redpanda:9092}
    listener:
      missing-topics-fatal: false
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: always
springdoc.swagger-ui.path: /swagger-ui.html
aurora.signals.location: ${AURORA_SIGNALS_LOCATION:classpath:/signals/*.yaml}
logging.pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","correlationId":"%X{correlationId:-}","logger":"%c","message":"%m"}%n'
