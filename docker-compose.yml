services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: aurora, POSTGRES_USER: aurora, POSTGRES_PASSWORD: aurora_dev }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092", "--advertise-kafka-addr", "internal://redpanda:9092"]
    ports: ["9092:9092"]
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/aurora
      DATABASE_USER: aurora
      DATABASE_PASSWORD: aurora_dev
      FLYWAY_ENABLED: "true"
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, redpanda: { condition: service_started } }
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8080 }
    depends_on: [backend]
